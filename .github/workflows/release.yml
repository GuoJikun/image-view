name: Release

# Only build and publish when a version tag is pushed. Tags must start with "v".
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate tag and version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      release_body: ${{ steps.changelog.outputs.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches versions
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::Release tag must start with 'v' followed by a number (got '$TAG')."
            exit 1
          fi

          WS_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAURI_VERSION=$(python3 -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")

          if [[ "$TAG" != "v$WS_VERSION" ]]; then
            echo "::error::Tag '$TAG' does not match workspace version '$WS_VERSION' (expected 'v$WS_VERSION')."
            exit 1
          fi

          if [[ "$TAURI_VERSION" != "$WS_VERSION" ]]; then
            echo "::error::tauri.conf.json version '$TAURI_VERSION' does not match workspace version '$WS_VERSION'."
            exit 1
          fi

          echo "Releasing image-view v$WS_VERSION"

      # Release 正文取自 CHANGELOG.md 的对应版本段，保持单一来源。
      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')

          SECTION=$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { inside = 0 }
            inside { print }
          ' CHANGELOG.md)

          if [[ -z "${SECTION//[[:space:]]/}" ]]; then
            echo "::error::CHANGELOG.md 缺少 '## [$VERSION]' 段落，补齐后再打 tag。"
            exit 1
          fi

          {
            echo 'body<<RELEASE_BODY_EOF_7c1f'
            echo "$SECTION"
            echo ''
            echo '### 下载'
            echo ''
            echo '- Windows：`*-setup.exe`（普通电脑选 x64，ARM 设备选 arm64）'
            echo '- macOS：Apple 芯片选 `aarch64.dmg`，Intel 选 `x64.dmg`'
            echo '- Linux：`.deb`、`.rpm` 或 `.AppImage`'
            echo ''
            echo '安装后可通过「帮助 → 检查更新…」升级。'
            echo 'RELEASE_BODY_EOF_7c1f'
          } >> "$GITHUB_OUTPUT"

          echo "Extracted $(printf '%s\n' "$SECTION" | wc -l) lines of release notes."

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: windows-11-arm
            args: '--target aarch64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: 'image-view ${{ github.ref_name }}'
          releaseBody: ${{ needs.validate.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
