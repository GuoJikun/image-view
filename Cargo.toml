[workspace]
resolver = "3"
members = ["app", "crates/*"]
default-members = ["app"]

[workspace.package]
version = "1.5.0"
edition = "2024"
rust-version = "1.95"
# Not published to crates.io; also lets cargo-deny skip the workspace crates
# when checking licenses.
publish = false

[workspace.dependencies]
# 仅保留被两个及以上工作空间成员共享的依赖；单处使用的依赖直接内联到所属 crate。
# emath（egui 的数学类型，不含窗口/绘制）供 iv-image-render 与 Iced GUI 使用。
emath = "0.37"
image = { version = "0.25.10", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }
# 仅 `iv-infra` 用：解析插件时代的 `.window-state.json` 做一次性迁移。
serde_json = "1"
bytemuck = "1"
ron = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
# 保留符号表，让崩溃日志里的 backtrace 仍有函数名；只去掉调试信息。
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
