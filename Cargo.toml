[package]
name = "image-view"
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
description = "轻量级 Rust 桌面图片查看器"

# 图片格式能力与平台无关，保持为普通编译特性。
[features]
default = ["avif", "heic", "svg"]
avif = ["dep:imgalifier-avif", "dep:imgalifier-heif"]
heic = [
    "dep:imgalifier-heif",
    "imgalifier-heif/hevc",
    "imgalifier-heif/unci-compression",
]
svg = ["dep:resvg"]

[dependencies]
# 使用 glow（OpenGL）而非默认 wgpu：egui-wgpu 不支持纹理 mipmap_mode。
# 平台专属的窗口后端特性（wayland/x11）见下方 target 段。
eframe = { version = "0.37", default-features = false, features = [
    "persistence",
    "glow",
    "default_fonts",
    "system_fonts",
    "clipboard",
    "accesskit",
    "links",
] }
egui = "0.37"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
    "qoi",
    "tga",
    "pnm",
    "hdr",
    "exr",
    "dds",
    "rayon",
] }
# 文件对话框：Windows/macOS 使用系统 API，无需额外特性；Linux/BSD 的后端特性见 target 段。
rfd = { version = "0.18", default-features = false }
natord = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
sys-locale = "0.3"
ureq = "3.5"
# 回收站：chrono 提供条目时间信息，各平台通用；平台专属特性见 target 段。
trash = { version = "5", default-features = false, features = ["chrono"] }
lcms2 = "6.2"
bytemuck = "1"
# 更新说明为 Markdown：用 pulldown-cmark 解析，关闭图片加载等默认特性。
egui_commonmark = { version = "0.26", default-features = false, features = [
    "pulldown_cmark",
] }
imgalifier-avif = { version = "0.1", optional = true }
imgalifier-heif = { version = "0.1", optional = true, default-features = false }
# SVG 光栅化（含 usvg + tiny-skia），纯 Rust、无系统 DLL；默认特性已含 text/system-fonts/raster-images。
resvg = { version = "0.50", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows 回收站调用前把线程初始化为 STA。
trash = { version = "5", default-features = false, features = [
    "coinit_apartmentthreaded",
] }
# 更新下载读取 Windows 系统代理（Internet Settings），并保留 ALL_PROXY/HTTPS_PROXY 等环境变量优先。
ureq = { version = "3.5", features = ["win-system-proxy"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
# Linux/BSD：X11 + Wayland 窗口后端、XDG portal 文件对话框、freedesktop 回收站规范。
eframe = { version = "0.37", default-features = false, features = [
    "wayland",
    "x11",
] }
rfd = { version = "0.18", default-features = false, features = [
    "xdg-portal",
    "wayland",
] }
trash = { version = "5", default-features = false, features = ["freedesktop"] }

[profile.release]
lto = "thin"
codegen-units = 1
# 保留符号表，让崩溃日志里的 backtrace 仍有函数名；只去掉调试信息。
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
