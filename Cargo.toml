[package]
name = "image-view"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "轻量级 Rust 桌面图片查看器"

[dependencies]
eframe = "0.37"
egui = "0.37"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
    "qoi",
    "tga",
    "pnm",
    "hdr",
    "exr",
    "dds",
    "rayon",
] }
rfd = "0.18"
natord = "1.0"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
