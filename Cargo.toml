[package]
name = "image-view"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "轻量级 Rust 桌面图片查看器"

[features]
default = ["avif", "heic"]
avif = ["dep:imgalifier-avif", "dep:imgalifier-heif"]
heic = [
    "dep:imgalifier-heif",
    "imgalifier-heif/hevc",
    "imgalifier-heif/unci-compression",
]

[dependencies]
# 使用 glow（OpenGL）而非默认 wgpu：egui-wgpu 不支持纹理 mipmap_mode。
eframe = { version = "0.37", default-features = false, features = [
    "persistence",
    "glow",
    "default_fonts",
    "system_fonts",
    "clipboard",
    "accesskit",
    "links",
    "wayland",
    "x11",
] }
egui = "0.37"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
    "qoi",
    "tga",
    "pnm",
    "hdr",
    "exr",
    "dds",
    "rayon",
] }
rfd = "0.18"
natord = "1.0"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
trash = "5"
lcms2 = "6.2"
bytemuck = "1"
imgalifier-avif = { version = "0.1", optional = true }
imgalifier-heif = { version = "0.1", optional = true, default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
# 保留符号表，让崩溃日志里的 backtrace 仍有函数名；只去掉调试信息。
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
