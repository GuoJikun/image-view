[workspace]
resolver = "3"
members = ["apps/eframe-app", "crates/*"]
default-members = ["apps/eframe-app"]

[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.95"
# Not published to crates.io; also lets cargo-deny skip the workspace crates
# when checking licenses.
publish = false

[workspace.dependencies]
# GUI 层：只有 apps/eframe-app 依赖 eframe/egui。
eframe = { version = "0.37", default-features = false }
egui = "0.37"
# egui 的数学类型 crate，不含窗口/绘制能力，供 iv-image-render 使用。
emath = "0.37"
image = { version = "0.25.10", default-features = false }
rfd = { version = "0.18", default-features = false }
natord = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
sys-locale = "0.3"
ureq = "3.5"
trash = { version = "5", default-features = false, features = ["chrono"] }
lcms2 = "6.2"
bytemuck = "1"
egui_commonmark = { version = "0.26", default-features = false }
ron = "0.12"
imgalifier-avif = "0.1"
imgalifier-heif = { version = "0.1", default-features = false }
resvg = "0.50"

[profile.release]
lto = "thin"
codegen-units = 1
# 保留符号表，让崩溃日志里的 backtrace 仍有函数名；只去掉调试信息。
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
