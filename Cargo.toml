[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/*"]
default-members = ["app/src-tauri"]

[workspace.package]
version = "1.2.1"
edition = "2024"
rust-version = "1.95"
# Not published to crates.io; also lets cargo-deny skip the workspace crates
# when checking licenses.
publish = false

[workspace.dependencies]
emath = "0.37"
image = { version = "0.25.10", default-features = false }
rfd = { version = "0.18", default-features = false }
natord = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = { version = "5", default-features = false, features = ["chrono"] }
lcms2 = "6.2"
bytemuck = "1"
ron = "0.12"
imgalifier-avif = "0.1"
imgalifier-heif = { version = "0.1", default-features = false }
resvg = "0.50"

[profile.release]
lto = "thin"
codegen-units = 1
# 保留符号表，让崩溃日志里的 backtrace 仍有函数名；只去掉调试信息。
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
