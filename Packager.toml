# Packaging configuration for cargo-packager.
#
# Build the Windows installer with:
#   cargo packager --release
# or through scripts\build-release.ps1.
#
# Format reference: https://docs.rs/cargo-packager/latest/cargo_packager/config/struct.Config.html
# Keys are camelCase because the config is deserialized with
# `deny_unknown_fields`, so `before-packaging-command` is rejected.
#
# The NSIS toolchain is provisioned once into %LOCALAPPDATA%\.cargo-packager.
# cargo-packager deletes and re-downloads that whole directory if any required
# file is missing, so never remove individual files from it.

name = "image-view"
productName = "image-view"
version = "1.1.0"
identifier = "io.github.guojikun.image-view"
description = "Lightweight Rust image viewer"
publisher = "image-view"
copyright = "Copyright (c) image-view contributors"
category = "Photography"

outDir = "dist"
binariesDir = "target/release"
beforePackagingCommand = "cargo build --release --locked"

binaries = [{ path = "image-view", main = true }]
icons = ["assets/icon.ico"]

# README and CHANGELOG are copied next to the executable.
resources = ["README.md", "CHANGELOG.md"]

formats = ["nsis"]

[nsis]
# Per-user install into %LOCALAPPDATA%\image-view, no administrator rights
# required. The application keeps logs\ and thumbs\ in the same directory, so
# the installer only deletes program files and leaves user data in place.
installMode = "currentUser"

# Project-owned script: the cargo-packager default template plus file
# association registration and uninstall cleanup.
template = "installer/nsis/image-view.nsi"

installerIcon = "assets/icon.ico"
languages = ["English", "SimpChinese"]
displayLanguageSelector = true

# NSIS only accepts lzma, zlib or bzip2.
compression = "lzma"

# Ask the user before deleting app data. $LOCALAPPDATA/image-view is also the
# install root, so accepting the checkbox removes the (empty) program directory
# together with logs\ and thumbs\.
appdataPaths = ["$LOCALAPPDATA/image-view", "$APPDATA/image-view"]
